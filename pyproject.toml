[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fusion-mcp"
version = "0.1.0"
description = "Dependency-free command-line client for the local Autodesk Fusion MCP server, with write safety gates."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["fusion", "autodesk", "mcp", "cad", "cli"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Environment :: Console",
]

[project.scripts]
fusion-mcp = "fusion:main"

[tool.setuptools]
py-modules = ["fusion"]
